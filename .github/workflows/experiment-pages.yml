name: Experiment Pages build-versie

# Tijdelijk experiment voor OTAP-CI: activeert GitHub Pages een tweede
# publicatie voor dezelfde commit, en welk versienummer accepteert de API?
#   standaard  = actions/deploy-pages (build-versie = GITHUB_SHA)
#   uniek      = eigen aanroep, build-versie "sha-run-poging"  (gaf 404)
#   eigen-sha  = eigen aanroep, build-versie = GITHUB_SHA (zelfde als deploy-pages)
#   andere-sha = eigen aanroep, build-versie = een andere, wél bestaande commit
# Elke publicatie bevat build.txt met het run-nummer, zodat live te zien is
# welke publicatie actief is.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: standaard, uniek, eigen-sha of andere-sha
        required: true
        type: choice
        options: [standaard, uniek, eigen-sha, andere-sha]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Site met run-nummer
        run: |
          mkdir -p dist
          echo "${{ github.run_id }}" > dist/build.txt
          echo "<!doctype html><title>Experiment</title><p>modus=${{ inputs.modus }} run=${{ github.run_id }} sha=${{ github.sha }}</p>" > dist/index.html

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with: { path: dist }

      - name: Publiceren met deploy-pages (standaard)
        if: inputs.modus == 'standaard'
        uses: actions/deploy-pages@v4

      - name: Publiceren met eigen aanroep
        if: inputs.modus != 'standaard'
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          MODUS: ${{ inputs.modus }}
        with:
          script: |
            const eigenaar = context.repo.owner, repo = context.repo.repo
            let versie
            if (process.env.MODUS === 'uniek') {
              versie = `${context.sha}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`
            } else if (process.env.MODUS === 'eigen-sha') {
              versie = context.sha
            } else {
              const { data: commits } = await github.request('GET /repos/{owner}/{repo}/commits', { owner: eigenaar, repo, per_page: 10 })
              const ander = commits.find(c => c.sha !== context.sha)
              if (!ander) throw new Error('geen andere commit gevonden')
              versie = ander.sha
            }
            core.info(`RESULTAAT modus=${process.env.MODUS} build-versie=${versie} (run-sha=${context.sha})`)
            const idToken = await core.getIDToken()
            let dep
            try {
              ({ data: dep } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                owner: eigenaar, repo,
                artifact_id: Number(process.env.ARTIFACT_ID),
                pages_build_version: versie,
                oidc_token: idToken
              }))
            } catch (e) {
              core.info(`RESULTAAT aanmaken mislukt: HTTP ${e.status} ${e.message}`)
              throw e
            }
            core.info(`RESULTAAT deployment aangemaakt: ${JSON.stringify(dep)}`)
            const id = dep.id || (dep.status_url || '').split('/').pop() || versie
            const fout = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_perms_error', 'deployment_attempt_error']
            for (let i = 0; i < 90; i++) {
              const { data: st } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {
                owner: eigenaar, repo, pages_deployment_id: id
              })
              core.info(`status: ${st.status}`)
              if (st.status === 'succeed') { core.info('RESULTAAT status succeed'); return }
              if (fout.includes(st.status)) throw new Error('publicatie mislukt: ' + st.status)
              await new Promise(r => setTimeout(r, 5000))
            }
            throw new Error('publicatie niet binnen de tijd klaar')
